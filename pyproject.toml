[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-provenance-demo"
version = "0.1.0"
description = "Tiny Python CLI artifact for demonstrating software supply chain provenance."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Cybersecurity final project team" }
]

[project.scripts]
hello-provenance = "hello_provenance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
